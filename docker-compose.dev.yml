services:
  redis:
    image: redis:7-alpine
    container_name: car-rental-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - car-rental-network

  postgres:
    image: postgres:15
    container_name: car-rental-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - car-rental-network

  car-rental:
    build:
      context: .
      dockerfile: carRental/Dockerfile
    image: charroux/car-rental:dev
    container_name: car-rental-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Use the production Spring profile to make the app read the SPRING_DATASOURCE_* variables
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      # Redis configuration
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
      # gRPC service configuration
      AUCTION_SERVICE_HOST: "auction-service"
      AUCTION_SERVICE_PORT: "9090"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      auction-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - car-rental-network

  event-router:
    build:
      context: .
      dockerfile: eventRouterService/Dockerfile
    image: charroux/event-router:dev
    container_name: event-router
    restart: unless-stopped
    environment:
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      SUBSCRIPTIONS_DIR: "/app/subscriptions"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')"]
      interval: 5s
      timeout: 3s
      retries: 6
    networks:
      - car-rental-network

  insurance-service:
    build:
      context: .
      dockerfile: insuranceService/Dockerfile
    image: charroux/insurance-service:dev
    container_name: insurance-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_DATA_REDIS_HOST: "redis"
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - car-rental-network

  auction-service:
    build:
      context: .
      dockerfile: auctionServiceServer/Dockerfile
    image: charroux/auction-service:dev
    container_name: auction-service
    restart: unless-stopped
    environment:
      # Ensure Gradle can find auctionService module
      GRADLE_USER_HOME: /gradle
    ports:
      - "9090:9090"  # Expose gRPC port
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9090"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - car-rental-network

  frontend-angular:
    build:
      context: ./car-rental-angular
      dockerfile: Dockerfile
    image: charroux/car-rental-angular:dev
    container_name: car-rental-frontend
    restart: unless-stopped
    ports:
      - "4200:80"  # Map host port 4200 to container nginx port 80
    depends_on:
      car-rental:
        condition: service_healthy
      insurance-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:
      - ./car-rental-angular/nginx-docker-compose.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - car-rental-network

volumes:
  redis-data:
    name: car_rental_redis_data
  postgres-data:
    name: car_rental_postgres_data
  gradle-cache:
    name: gradle_cache

networks:
  car-rental-network:
    driver: bridge

