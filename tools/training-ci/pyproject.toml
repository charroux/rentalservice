[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-training-ci"
version = "0.1.0"
description = "Checks immutable training modules and versioned event contracts"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema[format]>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
training-ci = "training_ci.cli:main"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
