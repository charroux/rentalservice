apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-service
  namespace: rental-service
  labels:
    app: insurance-service
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      service-name: insurance-service
  template:
    metadata:
      labels:
        app: insurance-service
        component: backend
        service-name: insurance-service
    spec:
      containers:
        - name: insurance-service
          image: insurance-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_DATA_REDIS_HOST
              value: "redis"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "300m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: insurance-service
  namespace: rental-service
spec:
  selector:
    service-name: insurance-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  type: ClusterIP
