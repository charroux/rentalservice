spring.application.name=rentalQueryService
server.port=8082
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/rental_query?replicaSet=rs0&directConnection=true}
spring.data.mongodb.auto-index-creation=true
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
management.health.probes.enabled=true
projection.bootstrap.path=${PROJECTION_BOOTSTRAP_PATH:}
projection.rebuild-from-archive=${PROJECTION_REBUILD_FROM_ARCHIVE:false}
events.consumer.enabled=${EVENTS_CONSUMER_ENABLED:true}
