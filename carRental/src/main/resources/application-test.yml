# Test configuration with H2 database and embedded Redis
spring:
  config:
    activate:
      on-profile: test
  
  # H2 in-memory database for testing
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: false
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        jdbc:
          time_zone: UTC

# Logging for tests
logging:
  level:
    com.charroux.carRental: INFO
