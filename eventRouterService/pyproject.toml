[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rental-event-router"
version = "0.1.0"
description = "Reliable Redis Lists fan-out for the rental training platform"
requires-python = ">=3.12,<3.13"
dependencies = ["redis>=5.2,<6"]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
rental-event-router = "event_router.main:main"

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
